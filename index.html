<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="global.css">
    <title>ArtLumi</title>
</head>
<body>
    <header>
        <div class="header-content">
            <img class="logo-img" src="img/ArtLumi - Logo sem fundo.png" alt="Logo da ArtLumi">

            <button class="phone-btn border-btn">51 98648-3088</button>
        </div>

        <div class="hero-container">
            <div class="hero-txt">
                <h1>LUZ QUE ILUMINA</h1>
                <h1 class="destaque-cor">COR QUE TRANSFORMA</h1>
                <p>Serviços elétricos e pintura com acabamento preciso, atendimento direto e execução que respeita o seu espaço.</p>

                <div class="hero-btn">
                    <button class="white-btn border-btn">PEDIR ORÇAMENTO</button>
                    <button class="transparent-btn border-btn">VER SERVIÇOS ↓</button>
                </div>
            </div>
            
            <div class="hero-container-img">
                <div class="hero-img">
                    <div class="hero-img-txt">
                        <p>ELÉTRICA</p>
                        <p>PINTURA</p>
                    </div>
                    <img class="hero-img-box" src="img/hero-artlume.jpg" alt="Imagem do hero da ArtLumi">
                </div>
                <div class="hero-experiencia">
                    <span>10+</span>
                    <p>ANOS DE OBRA</p>
                </div>
            </div>

        </div>
    </header>
</body>
</html>
